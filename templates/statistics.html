<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiky podle dní - Kostelec n. O.</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ version }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="background-glob"></div>

    <div class="container">
        <header>
            <div class="header-content">
                <h1>Hlídač <span class="gradient-text">Parkoviště</span></h1>
                <p class="subtitle">Statistiky podle dní v týdnu</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="/" class="nav-button" style="text-decoration: none;">
                    🏠 Hlavní stránka
                </a>
            </div>
        </header>

        <main>
            <div class="card">
                <h2>Výběr dne v týdnu</h2>
                <div class="day-selector">
                    <button class="day-button" data-day="1">Po</button>
                    <button class="day-button" data-day="2">Út</button>
                    <button class="day-button" data-day="3">St</button>
                    <button class="day-button" data-day="4">Čt</button>
                    <button class="day-button" data-day="5">Pá</button>
                    <button class="day-button" data-day="6">So</button>
                    <button class="day-button" data-day="0">Ne</button>
                </div>
            </div>

            <div class="card chart-card">
                <h2>Průměrná obsazenost během dne</h2>
                <p class="selected-day-label" id="selected-day-label">Vybraný den: <strong
                        id="selected-day-name">Pondělí</strong></p>
                <div class="chart-container">
                    <canvas id="occupancyChart"></canvas>
                </div>
                <p class="chart-info" id="chart-info">Načítání...</p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Hlídač Parkoviště | Vyvíjeno s ❤️ a AI</p>
        </footer>
    </div>

    <script src="/static/statistics.js?v={{ version }}"></script>
</body>

</html>
