<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiv Snímků | Hlídač Parkoviště</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ version }}">
    <style>
        .archive-list {
            margin-top: 2rem;
            width: 100%;
            border-collapse: collapse;
        }

        .archive-list th,
        .archive-list td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .archive-list th {
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.875rem;
        }

        .archive-list tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .archive-list .filename {
            font-family: monospace;
            color: var(--accent-color);
        }

        .download-btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 0.5rem;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: rgba(34, 197, 94, 0.25);
            transform: translateY(-1px);
        }

        .preview-btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 0.5rem;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            margin-right: 0.5rem;
        }

        .preview-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: translateY(-1px);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90vh;
            border-radius: 0.5rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 1001;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

        #caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
            height: 150px;
        }
    </style>
</head>

<body>

    <div class="background-glob"></div>

    <div class="container">
        <header>
            <div class="header-content">
                <h1>Archiv <span class="gradient-text">Snímků</span></h1>
                <p class="subtitle">Servisní přístup k uloženým snímkům</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="/" class="nav-button" style="text-decoration: none;">
                    🏠 Domů
                </a>
            </div>
        </header>

        <main>
            <div class="card">
                <h2>Seznam souborů</h2>
                <div id="loading">Načítám seznam souborů...</div>
                <div style="overflow-x: auto;">
                    <table class="archive-list" id="file-table" style="display: none;">
                        <thead>
                            <tr>
                                <th>Název souboru</th>
                                <th>Datum úpravy</th>
                                <th>Velikost</th>
                                <th>Akce</th>
                            </tr>
                        </thead>
                        <tbody id="file-list-body">
                            <!-- Rows will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- The Modal -->
        <div id="imageModal" class="modal">
            <span class="close">&times;</span>
            <img class="modal-content" id="modalImg">
            <div id="caption"></div>
        </div>

        {% include '_footer.html' %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetchFiles();
            setupModal();
        });

        function setupModal() {
            const modal = document.getElementById("imageModal");
            const span = document.getElementsByClassName("close")[0];

            span.onclick = function () {
                modal.style.display = "none";
            }

            modal.onclick = function (event) {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            }

            document.addEventListener('keydown', function (event) {
                if (event.key === "Escape") {
                    modal.style.display = "none";
                }
            });
        }

        function openModal(filename) {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImg");

            modal.style.display = "flex";
            modalImg.src = "/service/archive/view/" + filename;
        }

        async function fetchFiles() {
            try {
                const response = await fetch('/api/archive/list');
                const files = await response.json();

                const table = document.getElementById('file-table');
                const loading = document.getElementById('loading');
                const tbody = document.getElementById('file-list-body');

                loading.style.display = 'none';
                table.style.display = 'table';

                if (files.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Žádné soubory v archivu.</td></tr>';
                    return;
                }

                tbody.innerHTML = files.map(file => {
                    // Format date
                    const date = new Date(file.modified_iso);
                    const localDate = date.toLocaleString('cs-CZ');

                    // Format size
                    const sizeKB = (file.size / 1024).toFixed(1);

                    return `
                        <tr>
                            <td class="filename">${file.filename}</td>
                            <td>${localDate}</td>
                            <td>${sizeKB} KB</td>
                            <td>
                                <button onclick="openModal('${file.filename}')" class="preview-btn">
                                    👁️ Náhled
                                </button>
                                <a href="/service/archive/download/${file.filename}" class="download-btn" download>
                                    ⬇️ Stáhnout
                                </a>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error fetching files:', error);
                document.getElementById('loading').innerText = 'Chyba při načítání souborů.';
            }
        }
    </script>
</body>

</html>
