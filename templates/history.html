<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Historie parkování v Kostelci nad Orlicí - zobrazení obsazenosti parkoviště na Palackého náměstí podle dnů a hodin. Historická data smart parkování.">
    <title>Historie Parkování Kostelec - Obsazenost podle Dnů | Hlídač Parkoviště</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/static/og-image.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hlídač">

    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ version }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    {% include '_google_analytics.html' %}
</head>

<body>

    <div class="background-glob"></div>

    <div class="container">
        <header>
            <div class="header-content">
                <h1>Hlídač <span class="gradient-text">Parkoviště</span></h1>
                <p class="subtitle">Kostelec nad Orlicí - Palackého náměstí</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="/" class="nav-button" style="text-decoration: none;">
                    🏠 Aktuální stav
                </a>
            </div>

        </header>

        <main>
            <div class="history-nav">
                <button id="btn-prev-day" class="nav-button">
                    <span class="arrow">←</span>
                    Předchozí den
                </button>
                <button id="btn-next-day" class="nav-button">
                    Následující den
                    <span class="arrow">→</span>
                </button>
                <div class="date-indicator">
                    <span class="calendar-icon">📅</span>
                    <span id="selected-date">--</span>
                </div>
            </div>

            <div class="card chart-card">
                <h2>Historie obsazenosti za vybraný den</h2>
                <div class="chart-container">
                    <canvas id="occupancyChart"></canvas>
                </div>
                <p class="chart-info" id="chart-info">Načítání...</p>
            </div>
        </main>

        {% include '_footer.html' %}
    </div>

    <script src="/static/history.js?v={{ version }}"></script>
</body>

</html>
